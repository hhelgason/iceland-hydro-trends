name: iceland-hydro-trends
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy
  - pandas
  - pyarrow
  - geopandas
  - matplotlib
  - scipy
  - statsmodels
  - seaborn
  # Notebooks (e.g. Figure 6 ERA5 rasters) and interactive use
  - jupyter
  - ipykernel
  - xarray
  - pip
  - pip:
    - pymannkendall  # This package is not available in conda, so we install it via pip
    - openpyxl  # pandas ExcelFile for climate indices workbook
